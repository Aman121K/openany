      <stop offset="0" stop-color="#2463eb"/>
      <stop offset="0.55" stop-color="#1741a6"/>
      <stop offset="1" stop-color="#5b3df0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

